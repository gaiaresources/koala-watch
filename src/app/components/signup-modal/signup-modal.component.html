<app-header-toolbar [title]="'Privacy Policy'" [showSideMenu]="false"></app-header-toolbar>

<ion-content class="ion-padding">
  <app-privacy-policy></app-privacy-policy>
</ion-content>
<ion-footer slot="fixed">
  <ion-buttons mode="md">
    <ion-button expand="full" (click)="accept()">Yes</ion-button>
    <ion-button expand="full" (click)="reject()">No</ion-button>
  </ion-buttons>
</ion-footer>
