<ion-item *ngIf="field && formGroup" [formGroup]="formGroup">
  <ion-input labelPlacement="stacked"
             [placeholder]="field.description || ''"
             [formControlName]="field.key"
             [readonly]="readonly"
             [type]="'number'"
             [step]="'0.000000001'"
             (ionChange)="doChange()"
             (ionBlur)="checkErrors()">

    <div slot="label">
      {{ field.label }}
      <ion-text *ngIf="error" color="danger">({{ error }})</ion-text>
    </div>

  </ion-input>

  <app-help-button *ngIf="field.example" [id]="'help-' + (field.key | classify)">
    {{ field.example }}
  </app-help-button>
</ion-item>
