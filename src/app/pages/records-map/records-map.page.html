<ion-content [fullscreen]="true">

  <google-map class="map-container"
              width="100%"
              height="100%"
              [id]="'map-page'"
              [mapId]="'map'"
              [center]="{ lat: -25, lng: 132 }"
              [zoom]="3.5"
              [options]="options">

    <ng-container *ngIf="records$ | async as markers">
      <map-marker *ngFor="let marker of markers"
                  [title]="marker.title"
                  [position]="marker.position"
                  [clickable]="true"
                  [icon]="marker.icon" (mapClick)="doMarkerClick(marker, $event)">
      </map-marker>
    </ng-container>
  </google-map>

</ion-content>
