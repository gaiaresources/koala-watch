<ng-container *ngIf="record$ | async as record">
  <ng-container *ngIf="dataset$ | async as dataset">
    <app-base-record [title]="'Observation'"
                     [dataset]="dataset"
                     [record]="record"
                     [countField]="'Count'"
                     (onSegment)="foo()"
                     [dateField]="'First Date'"
                     [deleteHeader]="'Observation'"
                     [deleteQuestion]="'Do you want to delete this observation?'">
    </app-base-record>
  </ng-container>
</ng-container>
